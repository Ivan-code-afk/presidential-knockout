<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>PRESIDENTIAL KNOCKOUT</title>
<meta name="description" content="A pixel-art parody fighting game: US presidents battle for a fifth term." />
<meta name="theme-color" content="#0b0f24" />
<link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>

<div id="touch" aria-hidden="true">
  <div id="stick"><div id="stickKnob"></div></div>
  <div id="btns">
    <button data-act="punch">PUNCH</button>
    <button data-act="kick">KICK</button>
    <button data-act="special">SPEC</button>
    <button data-act="super" class="super">SUPER</button>
    <button data-act="assist" class="vp">VP</button>
  </div>
  <button id="pauseBtn" data-act="pause">II</button>
</div>

<div id="rotate">
  <div class="rotIcon">📱↻</div>
  <div class="rotText">ROTATE YOUR PHONE</div>
  <button id="goFull">PLAY FULLSCREEN</button>
</div>

<script src="data.js?v=3"></script>
<script src="sprites.js?v=3"></script>
<script src="sounds/voices.js?v=3"></script>
<script src="game.js?v=3"></script>
</body>
</html>
